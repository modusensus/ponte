[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ponte"
version = "0.2.0"
description = "Persistent SSH reverse tunnel daemon CLI (Windows / Linux / macOS)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["ssh", "reverse-tunnel", "tunnel", "daemon", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
]
dependencies = [
    "typer",
    "rich",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[project.scripts]
ponte = "ponte.main:app"

[tool.setuptools]
packages = ["ponte"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["ponte"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# 阈值：低于此值 CI 视为失败，防止覆盖率回退。
fail_under = 55
