# SSH Reverse Tunnel CLI Configuration
# All paths support ~ for home directory expansion

[ssh]
host = "YOUR_SERVER_IP"
port = 22
user = "YOUR_SSH_USER"
# 按各平台 SSH 惯例放密钥即可（~ 自动展开）；如需自定义路径请直接改这里
identity_file = "~/.ssh/id_rsa"
known_hosts_file = "~/.ssh/known_hosts"

[ssh.options]
StrictHostKeyChecking = "accept-new"
ServerAliveInterval = 30
ServerAliveCountMax = 3
ExitOnForwardFailure = "yes"
TCPKeepAlive = "yes"

# Reverse tunnels: local_port -> remote_port
# The remote port is opened on the SSH server, forwarding to localhost:local_port
[[tunnels]]
remote_port = 23334
local_host = "localhost"
local_port = 2222
description = "WSL SSH via portproxy"

[[tunnels]]
remote_port = 17897
local_host = "localhost"
local_port = 7897
description = "Windows proxy"

[daemon]
# pid_file / log_file 缺省时按平台自动选择：
#   Windows: %LOCALAPPDATA%\ponte\
#   Linux:   ~/.local/state/ponte/
#   macOS:   ~/Library/Application Support/ponte/
# 需要自定义时在此指定，支持 ~ 展开。
# pid_file = "C:\\ssh-tunnel\\ponte.pid"
# log_file = "C:\\ssh-tunnel\\ponte.log"
log_max_bytes = 10485760   # 10 MB
log_backup_count = 3

[retry]
max_retries = 0            # 0 = infinite
base_delay = 5             # seconds
max_delay = 300            # 5 minutes
backoff_factor = 2.0
jitter = true               # add random jitter to avoid thundering herd

[health]
check_interval = 60        # seconds
remote_check_enabled = true
remote_check_timeout = 10  # seconds

[service]
# 开机自启服务身份（Linux systemd 单元名 / macOS launchd label 前缀）
name = "ponte"
autostart = true
kill_timeout = 5           # POSIX 优雅终止等待秒数，超时后 SIGKILL

[windows]
# 仅 Windows 使用
task_name = "SSH-Reverse-Tunnel"
ssh_exe = "D:\\Git\\usr\\bin\\ssh.exe"
# run_as = "system"  # 开机即起（默认）：以 SYSTEM 运行，登录前就通，但需提权且读不到用户密钥
# run_as = "user"    # 登录后起：以当前用户运行，能读 ~/.ssh 密钥、免提权，但不登录不通
run_as = "system"